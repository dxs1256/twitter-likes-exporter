name: Sync Twitter Likes

on:
  schedule:
    # 每天北京时间凌晨 02:00 运行 (对应 UTC 时间前一天 18:00)
    # 如果您想使用其他时区，可以根据需要调整 cron 表达式
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      CT0: ${{ secrets.X_CT0 }}
      USER_ID: ${{ secrets.X_USER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install tweetxvault
        run: pip install -r requirements.txt

      - name: Cache tweetxvault archive
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/tweetxvault
          key: tweetxvault-archive-${{ github.ref_name }}
          restore-keys: |
            tweetxvault-archive-

      - name: Configure auth
        run: python scripts/configure_auth.py

      - name: Sync likes
        run: |
          # 记录本次同步开始时间，用于清理已取消点赞的推文
          SYNC_START=$(python3 -c "from datetime import datetime, timezone; print(datetime.now(timezone.utc).isoformat())")
          echo "SYNC_START=$SYNC_START" >> "$GITHUB_ENV"
          # 始终 --full：完整遍历点赞时间线，刷新所有仍点赞记录的 synced_at，
          # 未出现在本次时间线中的记录（已取消点赞）synced_at 保持旧值，稍后被清理
          tweetxvault sync likes --full --skip-enrich --skip-articles --skip-media --skip-unfurl --skip-threads

      - name: Process and Export
        run: |
          # 1. Export full archive
          tweetxvault export json --collection likes --out exports/full_archive.json

          # 2. Remove likes that were unliked on X (synced_at older than this run)
          python scripts/prune_unliked.py exports/full_archive.json "$SYNC_START"

          # 3. Generate minimal JSON and links list
          python scripts/extract_minimal.py exports/full_archive.json exports/likes_mini.json
          python scripts/extract_links.py exports/full_archive.json > exports/likes_links.txt


      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add exports/
          git diff --staged --quiet || git commit -m "chore: update likes export"
          git push
